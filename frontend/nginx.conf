server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend isn't published to the host in docker-compose — this proxy is
    # the only way to reach it, which also keeps the app same-origin so the
    # browser never needs CORS. Backend routes are already mounted under
    # /api/... so no path rewriting here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, not append: nginx is the internet-facing edge here (not
        # an internal hop behind another trusted proxy), so a client-supplied
        # X-Forwarded-For must never survive — $proxy_add_x_forwarded_for
        # appends to it instead of replacing it, letting any client spoof a
        # fresh IP per request and trivially bypass the backend's rate
        # limiter, which trusts this header (see backend/Dockerfile).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
