server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only ever reached from Caddy on the private compose network — Caddy
    # is the internet-facing edge (TLS, /api routing, compression) and
    # nginx's job here is just serving the built SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
